# Runs a one-off Job that exercises the gateway end to end with a sandbox token:
# readiness, create payment, idempotent replay, refund. Any failing step fails
# the Job, which fails the analysis and blocks promotion (pre) or triggers
# a rollback (post).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-smoke-test
  namespace: payments
spec:
  args:
    - name: host
  metrics:
    - name: payment-smoke-test
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.10.1
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -eu
                        BASE="http://{{ args.host }}"
                        KEY="smoke-$(date +%s)-$$"
                        JSON="Content-Type: application/json"
                        BODY='{"amount":100,"currency":"INR","source_token":"tok_visa","description":"rollout smoke test"}'
                        idof() { echo "$1" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p'; }

                        echo "1/5 readiness"
                        curl -fsS "$BASE/readyz"; echo

                        echo "2/5 create payment"
                        P1=$(curl -fsS -X POST "$BASE/payments" -H "$JSON" -H "Idempotency-Key: $KEY" -d "$BODY")
                        echo "$P1"
                        echo "$P1" | grep -q '"status":"captured"'
                        ID1=$(idof "$P1")
                        [ -n "$ID1" ]

                        # The Service spreads requests over all pods. Every pod must return the
                        # same payment for the same key, and be able to read it back.
                        echo "3/5 idempotent replay x6 (hits different pods)"
                        for i in 1 2 3 4 5 6; do
                          P=$(curl -fsS -X POST "$BASE/payments" -H "$JSON" -H "Idempotency-Key: $KEY" -d "$BODY")
                          [ "$(idof "$P")" = "$ID1" ] || { echo "replay $i returned a different payment: $P"; exit 1; }
                        done

                        echo "4/5 read back x6"
                        for i in 1 2 3 4 5 6; do
                          curl -fsS "$BASE/payments/$ID1" | grep -q "\"id\":\"$ID1\""
                        done

                        echo "5/5 refund"
                        curl -fsS -X POST "$BASE/payments/$ID1/refund" | grep -q '"status":"refunded"'
                        echo "smoke test passed against $BASE"
