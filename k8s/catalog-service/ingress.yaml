# The "stable" Ingress. Argo Rollouts creates and updates a second
# canary Ingress (with nginx canary-weight annotations) next to this one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-service
  namespace: catalog
spec:
  ingressClassName: nginx
  rules:
    - host: catalog.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-service-stable
                port:
                  name: http
